# ============================================================
# Inzovate Enterprise ERP — Render Infrastructure Blueprint
# Deploy via: Render Dashboard -> "New" -> "Blueprint"
# ============================================================

databases:
  - name: inzovate-db
    databaseName: inzovate_db
    user: inzovate
    plan: free # Can upgrade to starter/standard for production
    region: oregon

services:
  - type: web
    name: inzovate-backend
    runtime: node
    plan: free # Can upgrade to starter/standard for production
    region: oregon
    buildCommand: |
      npm install
      npx prisma generate --schema=apps/backend/prisma/schema.prisma
      npm run build --prefix apps/backend
    startCommand: npx prisma migrate deploy --schema=apps/backend/prisma/schema.prisma && npm run db:seed --prefix apps/backend && npm run start --prefix apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: inzovate-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 900
      - key: JWT_REFRESH_TTL
        value: 604800
      - key: FRONTEND_URL
        value: "https://*.vercel.app,http://localhost:3000"
      - key: ENABLE_SWAGGER
        value: "true"
